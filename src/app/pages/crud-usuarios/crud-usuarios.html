<div class="header">
  <h1>Gestión de Usuarios</h1>
  <button mat-flat-button color="primary" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon> Nuevo Usuario
  </button>
</div>

<!-- 🔍 FILTRO DE BÚSQUEDA -->
<mat-form-field appearance="outline" class="filtro">
  <mat-label>Buscar usuario...</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput (keyup)="aplicarFiltro($event)" placeholder="Escribe un nombre o email">
</mat-form-field>

<!-- 📊 LA TABLA -->
<div class="tabla-container mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let u"> {{ u.id }} </td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
      <td mat-cell *matCellDef="let u"> {{ u.nombre }} </td>
    </ng-container>

    <!-- Columna Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let u"> {{ u.email }} </td>
    </ng-container>

    <!-- Columna Rol -->
    <ng-container matColumnDef="rol">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
      <td mat-cell *matCellDef="let u">
        <span class="badge" [class.admin]="u.rol === 'admin'">{{ u.rol }}</span>
      </td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button color="primary" (click)="abrirFormulario(u)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(u)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    <!-- Mensaje si la búsqueda no arroja resultados -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="columnas.length">
        No se encontraron usuarios que coincidan con la búsqueda.
      </td>
    </tr>
  </table>

  <!-- 📄 PAGINADOR -->
  <mat-paginator 
    [pageSizeOptions]="[5, 10, 20]" 
    showFirstLastButtons
    aria-label="Seleccionar página">
  </mat-paginator>
</div>
