<mat-toolbar color="primary" class="toolbar">
  <a routerLink="/" class="logo">
    <mat-icon>task</mat-icon>
    <span>MiApp</span>
  </a>

  <span class="spacer"></span>

  <a mat-button routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
  <a mat-button routerLink="/about" routerLinkActive="activo">Acerca de</a>

  @if (auth.autenticado()) {
    <a mat-button routerLink="/tareas" routerLinkActive="activo">Tareas</a>
    <a mat-button routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
    <a mat-button routerLink="/dashboard" routerLinkActive="activo">Mi cuenta</a>

    <button mat-button (click)="auth.logout()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  } @else {
    <a mat-flat-button routerLink="/login">Iniciar sesión</a>
  }
</mat-toolbar>
