<mat-sidenav-container class="layout-container">
  
  <!-- SIDEBAR (Menú Lateral) -->
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="logo">
      <mat-icon>dashboard</mat-icon>
      <span>MiApp Panel</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/app/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/app/crud-usuarios" routerLinkActive="active-link">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>CRUD Usuarios</span>
      </a>

      <a mat-list-item routerLink="/app/tareas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>task</mat-icon>
        <span matListItemTitle>Mis Tareas</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content class="content">
    
    <!-- Barra superior del layout privado -->
    <mat-toolbar color="primary" class="toolbar">
      <span class="spacer"></span>
      <span class="usuario">{{ auth.usuario()?.nombre }}</span>
      <button mat-icon-button (click)="cerrarSesion()" title="Cerrar Sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <!-- Aquí se cargan las rutas hijas -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
